# Test config for development

# Omit [http] entirely (or leave bind/port unset) to disable the analytic HTTP server unless you pass --http-server-*.
[http]
bind="0.0.0.0"
port=7880

[analytic]
# CLI flags override these entries when passed (see --help).
# flightSqlBind="0.0.0.0:50051"
# timeoutToExecuteQuery=60
# timeoutToStream=600
# maxSimultaneousQueries=5
# smallProfile=false

[mqtt]
serverAddress="mqtt://127.0.0.1:1884"
clientid="iotmonitorfhome2"

[history]
storageTopic="home/#"

[device_esp04]
watchTimeOut=60
helloTopic="home/esp04"
watchTopics="home/esp04/sensors/#"
stateTopics="home/esp04/actuators/#"

